#
# Fleet Tracker - Phase 2A Configuration (FIXED)
# nRF Connect SDK v3.1.1
# 
# Configuration Strategy:
# - A-GNSS enabled for fast fixes when LTE available
# - CONFIG_LOCATION_SERVICE_EXTERNAL=y allows standalone GPS without LTE
# - RTT configuration optimized for 3Hz GPS output
# - WATCHDOG DISABLED for debugging
#

# General config
CONFIG_FPU=y
CONFIG_NRF_MODEM_LIB=y

# Heap and stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_AT_MONITOR_HEAP_SIZE=1024

# Location library
CONFIG_LOCATION=y

# CRITICAL: Enables standalone GPS operation without cloud dependency
# GPS works with or without LTE/A-GNSS assistance
CONFIG_LOCATION_SERVICE_EXTERNAL=y

# RTT Configuration - CRITICAL SETTINGS (DO NOT CHANGE)
# These settings prevent RTT hang and ensure stable output at 3Hz GPS
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_LOG_BACKEND_RTT_OUTPUT_BUFFER_SIZE=256
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_RETRY_CNT=1
CONFIG_LOG_BACKEND_RTT_RETRY_DELAY_MS=1
CONFIG_LOG_PRINTK=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# LTE link control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_EDRX_REQ=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ_RAT="00000100"

# AT Host library
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_AT_HOST_LIBRARY=y

# A-GNSS Support (optional - GPS works without it)
# These configs enable A-GNSS assistance when LTE is connected
# If LTE is not available, GPS operates standalone (slower first fix)
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_REST=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y

# Certificate Management - Required for AWS device certificates
CONFIG_MODEM_KEY_MGMT=y

# ============================================================================
# AWS IoT Core - MQTT + TLS Configuration
# ============================================================================

# MQTT Client Library
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# TLS/mbedTLS - Required for secure MQTT connection to AWS
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_TLS_VERSION_1_2=y

# nRF Security with Nordic Security Backend
CONFIG_NRF_SECURITY=y
CONFIG_NORDIC_SECURITY_BACKEND=y
CONFIG_MBEDTLS_TLS_LIBRARY=y

# TF-M Crypto Dependencies
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_PK_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_SSL_CONTEXT_SERIALIZATION=n

# TLS Credentials
CONFIG_TLS_CREDENTIALS=y

# Date/time and JWT (required for A-GNSS)
CONFIG_DATE_TIME=y
CONFIG_MODEM_JWT=y

# CRITICAL: DISABLE WATCHDOG FOR DEBUGGING
# This prevents the 3-minute restart issue while we debug
# Re-enable once system is stable
CONFIG_WATCHDOG=n
CONFIG_TASK_WDT=n

# Thread monitoring for debugging
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

# Debug settings
CONFIG_DEBUG=y
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# Modem fault handling - CRITICAL for debugging
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y

# Prevent immediate reset on fatal error to see diagnostics
CONFIG_RESET_ON_FATAL_ERROR=n

# APN Configuration - replaces manual AT+CGDCONT
#CONFIG_LTE_NETWORK_DEFAULT_APN="uscc00000.enterprise0.usc-cdp"